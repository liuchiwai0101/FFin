<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Current Products · Family Finance</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div id="app-shell"></div>
  <main class="main space-y">
    <div>
      <p class="eyebrow">Active Portfolio</p>
      <h1>Current Products &amp; Term Deposits</h1>
      <p class="subtitle">Snapshot of active fixed deposits, retail bonds, and bank balances.</p>
    </div>
    <div id="empty" class="card" hidden>
      <h2 style="margin:0 0 0.5rem;">No current products</h2>
      <p class="subtitle">Upload Excel to load active holdings.</p>
      <p style="margin-top:1rem;"><a class="btn" href="./sync.html">Upload Excel</a></p>
    </div>
    <div id="panel" hidden>
      <div class="card">
        <div class="filters"><span class="muted" style="font-size:0.75rem;font-weight:800;text-transform:uppercase;">Member</span>
          <button class="chip active" data-user="All">All</button>
          <button class="chip" data-user="MA">MA</button>
          <button class="chip" data-user="Vin">Vin</button>
          <button class="chip" data-user="Miki">Miki</button>
        </div>
        <div class="filters"><span class="muted" style="font-size:0.75rem;font-weight:800;text-transform:uppercase;">Bank</span>
          <button class="chip active" data-bank="All">All</button>
          <button class="chip" data-bank="SC">SC</button>
          <button class="chip" data-bank="HS">HS</button>
          <button class="chip" data-bank="HSBC">HSBC</button>
          <button class="chip" data-bank="ICBC">ICBC</button>
          <button class="chip" data-bank="BOC">BOC</button>
        </div>
      </div>
      <div class="grid grid-3">
        <div class="card"><span class="kpi-label">Filtered Principal</span><p class="kpi-value" id="kpi-principal">—</p></div>
        <div class="card" style="background:#ecfdf5;border-color:#a7f3d0;"><span class="kpi-label" style="color:#065f46;">Filtered Expected Interest</span><p class="kpi-value green" id="kpi-interest">—</p></div>
        <div class="card"><span class="kpi-label">Total Maturity Value</span><p class="kpi-value" id="kpi-maturity">—</p></div>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th><button data-sort="ownerName" data-type="string">Member</button></th>
              <th><button data-sort="bank" data-type="string">Bank</button></th>
              <th><button data-sort="product" data-type="string">Product / Instrument</button></th>
              <th class="right"><button data-sort="amount" data-type="number">Principal</button></th>
              <th class="center"><button data-sort="rate" data-type="number">Rate</button></th>
              <th><button data-sort="toDate" data-type="date">Tenor &amp; Dates</button></th>
              <th class="right"><button data-sort="interest" data-type="number">Interest</button></th>
              <th class="right"><button data-sort="totalAmount" data-type="number">Total Return</button></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="./assets/app.js"></script>
  <script>
    if (!FFin.requireAuth()) throw new Error("auth");
    FFin.renderShell("current");

    const viewer = FFin.getCurrentUser();
    const admin = FFin.isAdmin(viewer);
    let userFilter = admin ? "All" : viewer.ownerKey;
    let bankFilter = "All";
    let sortKey = "ownerName";
    let sortType = "string";
    let sortDir = "asc";

    if (!admin) {
      const memberRow = document.querySelector(".filters");
      if (memberRow && memberRow.querySelector("[data-user]")) memberRow.hidden = true;
      const empty = document.getElementById("empty");
      if (empty) {
        empty.querySelector(".subtitle").textContent =
          "No holdings are visible for your account yet. Ask Vin (admin) to upload the family Excel workbook.";
        const uploadLink = empty.querySelector("a.btn");
        if (uploadLink) uploadLink.remove();
      }
    }

    function rows() {
      return FFin.loadVisibleStore().activeItems.filter((r) => {
        if (userFilter !== "All" && r.ownerName !== userFilter) return false;
        if (bankFilter !== "All" && !r.bank.toUpperCase().includes(bankFilter.toUpperCase())) return false;
        return true;
      });
    }

    function render() {
      const all = FFin.loadVisibleStore().activeItems;
      if (!all.length) {
        document.getElementById("empty").hidden = false;
        document.getElementById("panel").hidden = true;
        return;
      }
      document.getElementById("empty").hidden = true;
      document.getElementById("panel").hidden = false;
      const filtered = rows().sort((a, b) => {
        const av = sortType === "date" ? (a[sortKey] ? new Date(a[sortKey]).getTime() : null) : a[sortKey];
        const bv = sortType === "date" ? (b[sortKey] ? new Date(b[sortKey]).getTime() : null) : b[sortKey];
        return FFin.compare(av, bv, sortType, sortDir);
      });
      const principal = filtered.reduce((s, r) => s + r.amount, 0);
      const interest = filtered.reduce((s, r) => s + (r.interest || 0), 0);
      const maturity = filtered.reduce((s, r) => s + (r.totalAmount || r.amount), 0);
      document.getElementById("kpi-principal").textContent = FFin.formatAmount(principal);
      document.getElementById("kpi-interest").textContent = "+" + FFin.formatAmount(interest);
      document.getElementById("kpi-maturity").textContent = FFin.formatAmount(maturity);
      document.getElementById("rows").innerHTML = filtered.map((r) => `
        <tr>
          <td><span class="badge" style="background:#f1f5f9;color:#0f172a;">${r.ownerName}</span></td>
          <td><strong>${r.bank}</strong></td>
          <td>${r.product}${r.notes ? `<div class="muted" style="font-size:0.7rem;">${r.notes}</div>` : ""}</td>
          <td class="right mono"><strong>${FFin.formatAmount(r.amount, r.currency)}</strong></td>
          <td class="center">${r.rate ? `<span class="badge">${FFin.formatRate(r.rate)}</span>` : "—"}</td>
          <td>${r.fromDate && r.toDate
            ? `${FFin.formatDate(r.fromDate)} → ${FFin.formatDate(r.toDate)}${r.months ? `<div class="muted" style="font-size:0.7rem;">${r.months} Months</div>` : ""}`
            : `<span class="muted">Demand / Flexible</span>`}</td>
          <td class="right mono green">${(r.interest || 0) > 0 ? "+" + FFin.formatAmount(r.interest, r.currency) : "—"}</td>
          <td class="right mono"><strong>${FFin.formatAmount(r.totalAmount || r.amount, r.currency)}</strong></td>
        </tr>
      `).join("");
      document.querySelectorAll("th button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.sort === sortKey);
      });
    }

    document.querySelectorAll("[data-user]").forEach((btn) => {
      btn.addEventListener("click", () => {
        userFilter = btn.dataset.user;
        document.querySelectorAll("[data-user]").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });
    document.querySelectorAll("[data-bank]").forEach((btn) => {
      btn.addEventListener("click", () => {
        bankFilter = btn.dataset.bank;
        document.querySelectorAll("[data-bank]").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
    });
    document.querySelectorAll("th button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (sortKey === btn.dataset.sort) sortDir = sortDir === "asc" ? "desc" : "asc";
        else {
          sortKey = btn.dataset.sort;
          sortType = btn.dataset.type;
          sortDir = sortType === "number" || sortType === "date" ? "desc" : "asc";
        }
        render();
      });
    });

    render();
  </script>
</body>
</html>
