name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Same model as News (branch Pages): publish the latest docs/ to gh-pages.
  # Settings → Pages → Deploy from a branch → gh-pages / (root)
  # Repo must be public (or GitHub Pro) for https://liuchiwai0101.github.io/FFin/
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish docs/ onto gh-pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffin-pages
          cp -a docs/. /tmp/ffin-pages/
          touch /tmp/ffin-pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/ffin-pages/. .
          git add -A
          git commit -m "Publish latest static site to GitHub Pages"
          git push -f origin pages-publish:gh-pages
