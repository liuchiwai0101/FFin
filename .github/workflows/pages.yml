name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Settings → Pages → Deploy from a branch → gh-pages / (root)
  # Live URL: https://liuchiwai0101.github.io/FFin/
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Next.js static export for /FFin
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /FFin
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_GITHUB_BRANCH: gh-pages
          NEXT_PUBLIC_GITHUB_DATA_PATH: data/latest.json
      - name: Preserve shared deposit data from gh-pages
        run: |
          set -euo pipefail
          mkdir -p out/data
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git show origin/gh-pages:data/latest.json > out/data/latest.json 2>/dev/null || cp public/data/latest.json out/data/latest.json
          else
            cp public/data/latest.json out/data/latest.json
          fi
      - name: Publish out/ onto gh-pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffin-pages
          cp -a out/. /tmp/ffin-pages/
          touch /tmp/ffin-pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/ffin-pages/. .
          git add -A
          git commit -m "Publish Next.js static export to GitHub Pages"
          git push -f origin pages-publish:gh-pages
