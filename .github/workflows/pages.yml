name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Settings → Pages → Deploy from a branch → gh-pages / (root)
  # Live URL: https://liuchiwai0101.github.io/FFin/
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Next.js static export for /FFin
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /FFin
      - name: Publish out/ onto gh-pages
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffin-pages
          cp -a out/. /tmp/ffin-pages/
          touch /tmp/ffin-pages/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/ffin-pages/. .
          git add -A
          git commit -m "Publish Next.js static export to GitHub Pages"
          git push -f origin pages-publish:gh-pages
